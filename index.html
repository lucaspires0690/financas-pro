<!DOCTYPE html>
<html lang="pt-pt">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Gestor de Cobrança | Google Login</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;900&display=swap');
        body { font-family: 'Inter', sans-serif; background-color: #0f172a; color: #f1f5f9; }
        .glass-card { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.9); z-index: 100; align-items: center; justify-content: center; padding: 1.5rem; }
        .modal.active { display: flex; }
        .btn-google { background: white; color: #1f2937; transition: all 0.2s; }
        .btn-google:hover { background: #f3f4f6; transform: translateY(-2px); }
    </style>
</head>
<body class="min-h-screen">

    <!-- TELA DE AUTENTICAÇÃO (GOOGLE) -->
    <div id="view-auth" class="min-h-screen flex items-center justify-center p-6">
        <div class="w-full max-w-sm text-center">
            <div class="mb-10">
                <h1 class="text-4xl font-black tracking-tighter text-white">Gestor<span class="text-indigo-500">Pro</span></h1>
                <p class="text-slate-500 text-xs font-bold uppercase tracking-[0.3em] mt-2">Acesso Seguro</p>
            </div>
            
            <div class="glass-card p-10 rounded-[3rem] shadow-2xl">
                <p class="text-slate-400 text-sm mb-8">Gerencie suas cobranças de forma privada e segura.</p>
                
                <button onclick="fazerLoginGoogle()" class="btn-google w-full py-4 rounded-2xl font-bold flex items-center justify-center gap-3 shadow-xl">
                    <svg class="w-5 h-5" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.66l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    Entrar com Google
                </button>
            </div>
        </div>
    </div>

    <!-- APP PRINCIPAL -->
    <div id="view-app" class="hidden p-4 md:p-8">
        <div class="max-w-2xl mx-auto flex justify-between items-start mb-8">
            <div>
                <h1 class="text-3xl font-black tracking-tighter">Meus Devedores</h1>
                <div class="flex items-center gap-2 mt-1">
                    <img id="user-photo" class="w-5 h-5 rounded-full border border-indigo-500/50 hidden">
                    <p id="user-display" class="text-indigo-500 text-[10px] font-black uppercase tracking-widest"></p>
                </div>
            </div>
            <div class="flex gap-2">
                <button onclick="fazerLogout()" class="p-3 text-slate-500 hover:text-red-500 transition-all">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1" /></svg>
                </button>
                <button onclick="abrirModalPessoa()" class="bg-indigo-600 hover:bg-indigo-500 text-white p-3 rounded-2xl transition-all shadow-lg shadow-indigo-600/20">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4" /></svg>
                </button>
            </div>
        </div>

        <div id="view-lista" class="max-w-2xl mx-auto">
            <div id="lista-pessoas" class="grid grid-cols-1 md:grid-cols-2 gap-4"></div>
            <div id="empty-state" class="hidden text-center py-20 border-2 border-dashed border-slate-800 rounded-[3rem]">
                <p class="text-slate-600 font-bold uppercase text-xs tracking-widest">Nenhum devedor encontrado</p>
            </div>
        </div>

        <!-- TELA DETALHES -->
        <div id="view-detalhes" class="max-w-md mx-auto hidden">
            <button onclick="voltarParaLista()" class="mb-6 flex items-center gap-2 text-slate-500 hover:text-white font-bold text-xs uppercase transition-all">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7" /></svg>
                Voltar
            </button>

            <div class="glass-card rounded-[2.5rem] overflow-hidden">
                <div class="p-10 text-center bg-slate-900/60 relative">
                    <button onclick="abrirModalMeta()" class="absolute top-6 right-6 p-2 text-slate-500 hover:text-white transition-all">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15.232 5.232l3.536 3.536m-2.036-5.036a2.5 2.5 0 113.536 3.536L6.5 21.036H3v-3.572L16.732 3.732z" /></svg>
                    </button>
                    <h2 id="detalhe-nome" class="text-xl font-black text-indigo-400 uppercase tracking-tighter mb-1">---</h2>
                    <span class="text-[10px] font-black text-slate-500 uppercase tracking-[0.3em]">Em aberto</span>
                    <h1 id="detalhe-saldo" class="text-5xl font-black text-white mt-2 tracking-tighter">R$ 0,00</h1>
                    <div class="mt-8 w-full bg-slate-800/40 rounded-full h-2 overflow-hidden">
                        <div id="detalhe-barra" class="bg-indigo-500 h-full rounded-full transition-all duration-1000" style="width: 0%"></div>
                    </div>
                </div>

                <div class="p-6 border-y border-white/5 bg-slate-900/20 flex gap-2">
                    <input type="number" id="input-pagamento" placeholder="Valor R$" step="0.01" class="flex-[2] bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white font-bold outline-none">
                    <button onclick="lancarPagamento()" class="flex-1 bg-indigo-600 hover:bg-indigo-500 text-white font-black text-[10px] uppercase rounded-xl transition-all">Lançar</button>
                </div>

                <div class="p-6">
                    <h3 class="text-[10px] font-black text-slate-500 uppercase tracking-widest mb-4 text-center">Histórico de Recebimentos</h3>
                    <div id="detalhe-historico" class="space-y-2 max-h-60 overflow-y-auto pr-2"></div>
                </div>

                <div class="p-4 bg-slate-950/40 text-center">
                    <button onclick="deletarPessoaAtual()" class="text-[9px] text-red-900 hover:text-red-500 font-black uppercase transition-colors">Excluir Registro</button>
                </div>
            </div>
        </div>
    </div>

    <!-- MODAIS -->
    <div id="modal-pessoa" class="modal">
        <div class="bg-slate-900 border border-white/10 p-8 rounded-[2.5rem] w-full max-w-xs shadow-2xl">
            <h2 class="text-white font-black text-xl mb-6 uppercase tracking-tight">Novo Devedor</h2>
            <div class="space-y-4">
                <input type="text" id="novo-nome" placeholder="Nome" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-4 text-white font-bold outline-none">
                <input type="number" id="novo-valor" placeholder="Dívida Total R$" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-4 text-white font-bold outline-none">
            </div>
            <div class="flex gap-4 mt-8">
                <button onclick="fecharModalPessoa()" class="flex-1 text-slate-500 font-bold text-xs uppercase">Cancelar</button>
                <button onclick="salvarPessoa()" class="flex-1 py-4 bg-indigo-600 rounded-2xl text-white font-black text-xs uppercase">Salvar</button>
            </div>
        </div>
    </div>

    <div id="modal-meta" class="modal">
        <div class="bg-slate-900 border border-white/10 p-8 rounded-[2.5rem] w-full max-w-xs shadow-2xl">
            <h2 class="text-white font-black text-xl mb-4 uppercase tracking-tight text-center">Editar Valor</h2>
            <input type="number" id="edit-meta" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-4 text-white font-black text-lg outline-none">
            <div class="flex gap-4 mt-8">
                <button onclick="fecharModalMeta()" class="flex-1 text-slate-500 font-bold text-xs uppercase">Sair</button>
                <button onclick="confirmarNovaMeta()" class="flex-1 py-4 bg-indigo-600 rounded-2xl text-white font-black text-xs uppercase">Atualizar</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, GoogleAuthProvider, signInWithPopup, onAuthStateChanged, signOut } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, doc, onSnapshot, setDoc, updateDoc, deleteDoc } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyCHzkNkJK56L4d7ncVbZfjB9pCWacqF3Cc",
            authDomain: "gestor-cobranca.firebaseapp.com",
            projectId: "gestor-cobranca",
            storageBucket: "gestor-cobranca.firebasestorage.app",
            messagingSenderId: "553918891395",
            appId: "1:553918891395:web:be2d2bcbbe13d33c8ee2b6"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();
        
        let currentUser = null;
        let devedores = [];
        let pessoaAtivaId = null;
        let unsubscribeSnapshot = null;

        // --- AUTENTICAÇÃO GOOGLE ---
        onAuthStateChanged(auth, (user) => {
            if (user) {
                currentUser = user;
                document.getElementById('view-auth').classList.add('hidden');
                document.getElementById('view-app').classList.remove('hidden');
                
                const userDisplay = document.getElementById('user-display');
                const userPhoto = document.getElementById('user-photo');
                userDisplay.innerText = user.displayName || user.email;
                if(user.photoURL) {
                    userPhoto.src = user.photoURL;
                    userPhoto.classList.remove('hidden');
                }
                
                iniciarEscutaDados();
            } else {
                currentUser = null;
                document.getElementById('view-auth').classList.remove('hidden');
                document.getElementById('view-app').classList.add('hidden');
                if (unsubscribeSnapshot) unsubscribeSnapshot();
            }
        });

        window.fazerLoginGoogle = () => {
            signInWithPopup(auth, provider).catch(err => alert("Falha no login: " + err.message));
        };

        window.fazerLogout = () => signOut(auth);

        // --- GESTÃO DE DADOS ---
        function iniciarEscutaDados() {
            const colRef = collection(db, "users", currentUser.uid, "devedores");
            unsubscribeSnapshot = onSnapshot(colRef, (snapshot) => {
                devedores = [];
                snapshot.forEach(doc => devedores.push({ id: doc.id, ...doc.data() }));
                renderizarLista();
                if (pessoaAtivaId) atualizarViewDetalhes();
            });
        }

        const getPessoaDoc = (id) => doc(db, "users", currentUser.uid, "devedores", id);

        window.renderizarLista = () => {
            const container = document.getElementById('lista-pessoas');
            const empty = document.getElementById('empty-state');
            if (devedores.length === 0) {
                container.innerHTML = "";
                empty.classList.remove('hidden');
                return;
            }
            empty.classList.add('hidden');
            container.innerHTML = devedores.map(p => {
                const totalPago = (p.pagamentos || []).reduce((acc, pg) => acc + pg.valor, 0);
                const saldo = Math.max(0, p.meta - totalPago);
                return `
                <div onclick="verPessoa('${p.id}')" class="glass-card p-6 rounded-[2rem] cursor-pointer hover:border-indigo-500/50 transition-all active:scale-95 group">
                    <h3 class="font-black text-white uppercase text-sm mb-4 group-hover:text-indigo-400 truncate">${p.nome}</h3>
                    <div class="flex justify-between items-end">
                        <div>
                            <p class="text-[9px] text-slate-500 font-bold uppercase tracking-widest">Restante</p>
                            <p class="text-xl font-black text-white">R$ ${saldo.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</p>
                        </div>
                        <div class="bg-indigo-500/10 p-2 rounded-xl">
                             <svg class="w-4 h-4 text-indigo-400" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-width="2" d="M9 5l7 7-7 7"/></svg>
                        </div>
                    </div>
                </div>`;
            }).join('');
        };

        window.verPessoa = (id) => {
            pessoaAtivaId = id;
            document.getElementById('view-lista').classList.add('hidden');
            document.getElementById('view-detalhes').classList.remove('hidden');
            atualizarViewDetalhes();
        };

        window.voltarParaLista = () => {
            pessoaAtivaId = null;
            document.getElementById('view-lista').classList.remove('hidden');
            document.getElementById('view-detalhes').classList.add('hidden');
        };

        window.salvarPessoa = async () => {
            const nome = document.getElementById('novo-nome').value.trim();
            const valor = parseFloat(document.getElementById('novo-valor').value);
            if (!nome || isNaN(valor)) return;
            const id = Date.now().toString();
            await setDoc(getPessoaDoc(id), { nome, meta: valor, pagamentos: [], criadoEm: new Date().toISOString() });
            fecharModalPessoa();
            document.getElementById('novo-nome').value = "";
            document.getElementById('novo-valor').value = "";
        };

        window.lancarPagamento = async () => {
            const input = document.getElementById('input-pagamento');
            const valor = parseFloat(input.value);
            if (isNaN(valor) || valor <= 0) return;
            const p = devedores.find(d => d.id === pessoaAtivaId);
            const novos = [...(p.pagamentos || []), { valor, data: new Date().toLocaleString('pt-BR') }];
            await updateDoc(getPessoaDoc(pessoaAtivaId), { pagamentos: novos });
            input.value = "";
        };

        window.removerPagamento = async (idx) => {
            const p = devedores.find(d => d.id === pessoaAtivaId);
            const novos = [...p.pagamentos];
            novos.splice(idx, 1);
            await updateDoc(getPessoaDoc(pessoaAtivaId), { pagamentos: novos });
        };

        window.deletarPessoaAtual = async () => {
            if (confirm("Deseja mesmo excluir permanentemente?")) {
                await deleteDoc(getPessoaDoc(pessoaAtivaId));
                voltarParaLista();
            }
        };

        window.confirmarNovaMeta = async () => {
            const v = parseFloat(document.getElementById('edit-meta').value);
            if (!isNaN(v)) {
                await updateDoc(getPessoaDoc(pessoaAtivaId), { meta: v });
                fecharModalMeta();
            }
        };

        function atualizarViewDetalhes() {
            const p = devedores.find(d => d.id === pessoaAtivaId);
            if (!p) return;
            const totalPago = (p.pagamentos || []).reduce((acc, pg) => acc + pg.valor, 0);
            const saldo = Math.max(0, p.meta - totalPago);
            const perc = p.meta > 0 ? (totalPago / p.meta) * 100 : 0;
            document.getElementById('detalhe-nome').innerText = p.nome;
            document.getElementById('detalhe-saldo').innerText = `R$ ${saldo.toLocaleString('pt-BR', {minimumFractionDigits: 2})}`;
            document.getElementById('detalhe-barra').style.width = `${perc}%`;
            const container = document.getElementById('detalhe-historico');
            container.innerHTML = [...(p.pagamentos || [])].reverse().map((pg, i) => {
                const realIdx = p.pagamentos.length - 1 - i;
                return `<div class="flex justify-between items-center bg-slate-800/40 p-4 rounded-xl mb-2 border border-white/5">
                    <div><p class="text-[8px] text-slate-500 font-bold">${pg.data}</p><p class="text-white font-black text-sm">R$ ${pg.valor.toFixed(2)}</p></div>
                    <button onclick="removerPagamento(${realIdx})" class="text-slate-700 hover:text-red-500 transition-colors">
                        <svg class="h-4 w-4" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" /></svg>
                    </button>
                </div>`;
            }).join('') || `<p class="text-center text-slate-700 text-[10px] py-6 font-bold uppercase">Sem registros</p>`;
        }

        window.abrirModalPessoa = () => document.getElementById('modal-pessoa').classList.add('active');
        window.fecharModalPessoa = () => document.getElementById('modal-pessoa').classList.remove('active');
        window.abrirModalMeta = () => {
            const p = devedores.find(d => d.id === pessoaAtivaId);
            document.getElementById('edit-meta').value = p.meta;
            document.getElementById('modal-meta').classList.add('active');
        };
        window.fecharModalMeta = () => document.getElementById('modal-meta').classList.remove('active');
    </script>
</body>
</html>
