<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minhas Finanças | Controle Simples</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
    <link rel="stylesheet" href="style.css">
</head>
<body class="min-h-screen">

    <!-- TELA DE LOGIN -->
    <div id="view-auth" class="min-h-screen flex items-center justify-center p-6">
        <div class="w-full max-w-sm text-center">
            <div class="mb-10">
                <h1 class="text-5xl font-black tracking-tighter">💰 Minhas<span class="text-indigo-500">Finanças</span></h1>
                <p class="text-slate-500 text-xs font-bold uppercase tracking-[0.3em] mt-2">Simples e Fácil</p>
            </div>
            <div class="glass-card p-8 rounded-3xl">
                <p class="text-slate-400 text-sm mb-6">Controle seu dinheiro de forma simples</p>
                <button onclick="fazerLoginGoogle()" class="btn-google w-full py-3 rounded-xl font-bold flex items-center justify-center gap-3">
                    <svg class="w-5 h-5" viewBox="0 0 24 24">
                        <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                        <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                        <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l3.66-2.84z"/>
                        <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.66l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z"/>
                    </svg>
                    Entrar com Google
                </button>
            </div>
        </div>
    </div>

    <!-- APP PRINCIPAL -->
    <div id="view-app" class="hidden p-4 md:p-6 max-w-4xl mx-auto">
        
        <!-- CABEÇALHO -->
        <div class="flex justify-between items-center mb-6">
            <div>
                <h1 class="text-2xl font-black">💰 Minhas Finanças</h1>
                <div class="flex items-center gap-2 mt-1">
                    <img id="user-photo" class="w-6 h-6 rounded-full hidden">
                    <p id="user-display" class="text-indigo-400 text-xs font-bold"></p>
                </div>
            </div>
            <button onclick="fazerLogout()" class="text-slate-500 hover:text-red-400">🚪 Sair</button>
        </div>

        <!-- FILTRO MÊS -->
        <div class="mb-4 flex justify-end">
            <input type="month" id="filtro-mes" class="bg-slate-800 border border-slate-700 rounded-lg px-3 py-1.5 text-sm">
        </div>

        <!-- CARDS -->
        <div class="grid grid-cols-2 md:grid-cols-3 gap-3 mb-6">
            <div class="glass-card p-4 text-center">
                <p class="text-slate-400 text-xs">💰 Total</p>
                <p id="card-total" class="text-xl font-black text-white">R$ 0</p>
            </div>
            <div class="glass-card p-4 text-center">
                <p class="text-slate-400 text-xs">📥 Entrou</p>
                <p id="card-entrou" class="text-xl font-black text-emerald-400">R$ 0</p>
            </div>
            <div class="glass-card p-4 text-center">
                <p class="text-slate-400 text-xs">📤 Saiu</p>
                <p id="card-saiu" class="text-xl font-black text-rose-400">R$ 0</p>
            </div>
        </div>

        <!-- GRÁFICO -->
        <div class="glass-card p-4 mb-6">
            <p class="text-sm font-bold mb-3">📁 Onde vai o dinheiro</p>
            <canvas id="grafico" height="150"></canvas>
        </div>

        <!-- ABAS -->
        <div class="flex gap-2 mb-4">
            <button onclick="mostrarAba('entrou')" id="aba-entrou" class="tab-ativa px-4 py-2 rounded-xl text-sm font-bold">📥 Entrou</button>
            <button onclick="mostrarAba('saiu')" id="aba-saiu" class="tab-inativa px-4 py-2 rounded-xl text-sm font-bold">📤 Saiu</button>
        </div>

        <!-- LISTA ENTROU -->
        <div id="lista-entrou" class="space-y-2">
            <div class="text-center text-slate-500 py-8">Nenhum registro</div>
        </div>

        <!-- LISTA SAIU -->
        <div id="lista-saiu" class="hidden space-y-2">
            <div class="text-center text-slate-500 py-8">Nenhum registro</div>
        </div>

        <!-- BOTÃO NOVO -->
        <button onclick="abrirModal()" class="fixed bottom-6 right-6 bg-indigo-600 w-14 h-14 rounded-full shadow-lg text-white text-3xl font-bold hover:bg-indigo-500 transition-all">
            +
        </button>
    </div>

    <!-- MODAL NOVO REGISTRO -->
    <div id="modal" class="modal">
        <div class="bg-slate-900 rounded-2xl p-6 w-full max-w-sm border border-white/10">
            <h2 class="text-xl font-bold mb-4">💰 Novo registro</h2>
            
            <div class="mb-4">
                <p class="text-sm text-slate-400 mb-2">Tipo:</p>
                <div class="flex gap-4">
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="radio" name="tipo" value="entrou" checked onchange="mudarCategorias()">
                        <span>📥 Entrou</span>
                    </label>
                    <label class="flex items-center gap-2 cursor-pointer">
                        <input type="radio" name="tipo" value="saiu" onchange="mudarCategorias()">
                        <span>📤 Saiu</span>
                    </label>
                </div>
            </div>

            <div class="mb-4">
                <p class="text-sm text-slate-400 mb-1">📝 O que é?</p>
                <input type="text" id="descricao" placeholder="Ex: Salário, Aluguel..." class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white">
            </div>

            <div class="mb-4">
                <p class="text-sm text-slate-400 mb-1">💰 Valor (R$)</p>
                <input type="number" id="valor" step="0.01" placeholder="0,00" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white font-bold">
            </div>

            <div class="mb-4">
                <p class="text-sm text-slate-400 mb-1">📁 Categoria</p>
                <select id="categoria" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white">
                    <option value="Salário">💼 Salário</option>
                    <option value="Freela">💻 Freela</option>
                    <option value="Outras entradas">📌 Outras</option>
                </select>
            </div>

            <div class="mb-4">
                <p class="text-sm text-slate-400 mb-1">📅 Data</p>
                <input type="date" id="data" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white">
            </div>

            <div class="mb-6">
                <p class="text-sm text-slate-400 mb-1">📅 Vai pagar em quantas vezes?</p>
                <select id="parcelas" class="w-full bg-slate-800 border border-slate-700 rounded-xl px-4 py-3 text-white">
                    <option value="1">À vista (1 vez)</option>
                    <option value="2">2 vezes</option>
                    <option value="3">3 vezes</option>
                    <option value="4">4 vezes</option>
                    <option value="5">5 vezes</option>
                    <option value="6">6 vezes</option>
                    <option value="8">8 vezes</option>
                    <option value="10">10 vezes</option>
                    <option value="12">12 vezes</option>
                </select>
            </div>

            <div class="flex gap-3">
                <button onclick="fecharModal()" class="flex-1 py-3 bg-slate-700 rounded-xl">Cancelar</button>
                <button onclick="salvar()" class="flex-1 py-3 bg-indigo-600 rounded-xl font-bold">Salvar</button>
            </div>
        </div>
    </div>

    <script type="module" src="app.js"></script>
</body>
</html>
